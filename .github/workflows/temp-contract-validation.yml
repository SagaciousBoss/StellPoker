name: Temporary Contract Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Format, check, clippy and contract tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          repository: SagaciousBoss/StellPoker
          ref: fix/1008-1009-1011-auth-and-api-parity

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Test token-gated-table
        run: cargo test -p token-gated-table

      - name: Test game-hub
        run: cargo test -p game-hub
