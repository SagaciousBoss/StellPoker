name: Temporary Contract Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Clippy and contract tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          repository: SagaciousBoss/StellPoker
          ref: fix/1008-1009-1011-auth-and-api-parity

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Clippy affected contract crates
        run: cargo clippy -p token-gated-table -p game-hub --all-targets -- -D warnings

      - name: Test token-gated-table
        run: cargo test -p token-gated-table

      - name: Test game-hub
        run: cargo test -p game-hub
